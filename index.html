<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONA 顧客アンケート 改善点チェック ダッシュボード</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --accent:#c8102e; --accent-soft:#fde8ea;
    --good:#0f7b52; --good-soft:#e5f4ec; --warn:#b45309; --warn-soft:#fdf1e0;
    --chip:#eef2f7; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px;}
  header.hero{
    background:linear-gradient(135deg,#a10c25 0%,#c8102e 55%,#e23b52 100%);
    color:#fff;border-radius:16px;padding:26px 28px;box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  header.hero h1{margin:0 0 6px;font-size:22px;letter-spacing:.02em;}
  header.hero p{margin:0;opacity:.92;font-size:13.5px;}
  .stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
  .stat{
    background:rgba(255,255,255,.14);backdrop-filter:blur(3px);
    border:1px solid rgba(255,255,255,.25);border-radius:12px;
    padding:10px 16px;min-width:120px;
  }
  .stat .num{font-size:24px;font-weight:700;line-height:1;}
  .stat .lbl{font-size:12px;opacity:.9;margin-top:4px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    justify-content:space-between;margin-bottom:14px;
  }
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .filters .flabel{font-size:12.5px;color:var(--muted);font-weight:600;}
  .seg{display:inline-flex;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .seg button{
    border:0;background:transparent;padding:6px 14px;border-radius:999px;
    font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;transition:.15s;
  }
  .seg button.active{background:var(--accent);color:#fff;}
  .search{
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;
    width:230px;max-width:48vw;box-shadow:var(--shadow);background:var(--card);color:var(--ink);
  }
  .search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}

  .tabs{
    display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px;box-shadow:var(--shadow);
  }
  .tab{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;
    cursor:pointer;color:var(--ink);transition:.15s;white-space:nowrap;font-weight:600;
  }
  .tab:hover{border-color:var(--accent);color:var(--accent);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .tab .badge{
    background:var(--chip);color:var(--ink);border-radius:999px;
    font-size:11.5px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center;
  }
  .tab.active .badge{background:rgba(255,255,255,.28);color:#fff;}

  .panel-head{display:flex;align-items:baseline;gap:12px;margin:4px 2px 12px;flex-wrap:wrap;}
  .panel-head h2{margin:0;font-size:19px;}
  .panel-head .sub{font-size:13px;color:var(--muted);}

  .table-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    overflow:hidden;box-shadow:var(--shadow);
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    position:sticky;top:0;background:#faf7f8;text-align:left;
    padding:12px 14px;font-size:12.5px;color:var(--muted);font-weight:700;
    border-bottom:2px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#fbfcfe;}
  td.dt{white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums;}
  td.visits{text-align:center;}
  .vpill{
    display:inline-block;background:var(--chip);border-radius:999px;
    padding:1px 9px;font-size:12px;font-weight:700;color:#374151;
  }
  .mtag{
    display:inline-block;font-size:11px;font-weight:700;border-radius:6px;
    padding:1px 7px;white-space:nowrap;
  }
  .m5{background:#e6f4ea;color:#0f7b52;}
  .m6{background:#f3e8fd;color:#7c3aed;}
  .m7{background:#e7eefc;color:#1d4ed8;}
  .m8{background:#fdeede;color:#b45309;}

  .cell-dissat{color:#3f1418;}
  .cell-dissat.filled{background:var(--accent-soft);border-left:3px solid var(--accent);
    border-radius:6px;padding:8px 10px;}
  .cell-comment{color:#153b2b;}
  .cell-comment.filled{background:var(--good-soft);border-left:3px solid var(--good);
    border-radius:6px;padding:8px 10px;}
  .empty{color:#c2c7d0;}
  .txt{white-space:pre-wrap;word-break:break-word;max-width:420px;}
  mark{background:#fff2a8;padding:0 2px;border-radius:3px;}

  .colw-dt{width:120px;}
  .colw-m{width:60px;}
  .colw-v{width:70px;}

  .noresult{padding:40px;text-align:center;color:var(--muted);}
  footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12px;}

  @media (max-width:720px){
    .txt{max-width:none;}
    thead{display:none;}
    table,tbody,tr,td{display:block;width:100%;}
    tbody tr{border-bottom:8px solid var(--bg);padding:6px 4px;}
    tbody td{border:0;padding:6px 12px;}
    td.dt::before{content:"来店日時: ";color:var(--muted);font-weight:600;}
    td.visits{text-align:left;}
    td.visits::before{content:"来店回数: ";color:var(--muted);font-weight:600;}
    td.c-dissat::before{content:"不満足な点-その他";display:block;color:var(--accent);font-weight:700;font-size:11px;margin-bottom:3px;}
    td.c-comment::before{content:"ご意見・ご感想";display:block;color:var(--good);font-weight:700;font-size:11px;margin-bottom:3px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>🍕 CONA 顧客アンケート 改善点チェック ダッシュボード</h1>
    <p>「ご意見・ご感想」または「不満足な点-その他」に記載のあるアンケートのみを抽出（2026年5月〜8月）</p>
    <div class="stats">
      <div class="stat"><div class="num" id="s-total">0</div><div class="lbl">抽出件数（合計）</div></div>
      <div class="stat"><div class="num" id="s-dissat">0</div><div class="lbl">不満足な点 記載</div></div>
      <div class="stat"><div class="num" id="s-comment">0</div><div class="lbl">ご意見・ご感想 記載</div></div>
      <div class="stat"><div class="num" id="s-stores">0</div><div class="lbl">対象店舗数</div></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="filters">
      <span class="flabel">対象月</span>
      <div class="seg" id="month-seg">
        <button data-m="all" class="active">すべて</button>
        <button data-m="2026年5月">5月</button>
        <button data-m="2026年6月">6月</button>
        <button data-m="2026年7月">7月</button>
        <button data-m="2026年8月">8月</button>
      </div>
      <span class="flabel" style="margin-left:8px;">表示内容</span>
      <div class="seg" id="type-seg">
        <button data-t="all" class="active">すべて</button>
        <button data-t="dissat">不満のみ</button>
        <button data-t="comment">ご意見のみ</button>
      </div>
    </div>
    <input class="search" id="search" type="search" placeholder="🔎 キーワードで絞り込み（全店舗横断）">
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="panel-head">
    <h2 id="panel-title">店舗</h2>
    <span class="sub" id="panel-sub"></span>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th class="colw-dt">来店日時</th>
          <th class="colw-m">月</th>
          <th class="colw-v">来店回数</th>
          <th>不満足な点-その他</th>
          <th>ご意見・ご感想</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="noresult" id="noresult" style="display:none;">該当するデータはありません。</div>
  </div>

  <footer>データ出典: リピつく顧客アンケート（CONA様）2026年7月・8月分 ／ 抽出条件: 「不満足な点-その他」または「ご意見・ご感想」に具体的記載があるもの</footer>
</div>

<script>
const DATA = {"stores": ["たまプラーザ店", "町田店", "京急蒲田店", "川崎店", "津田沼店", "西新宿一丁目店", "船橋店", "錦糸町店", "柏店", "横浜鶴屋町店", "横浜西口店", "大宮店", "田町芝浦店", "立川店", "上野店", "新宿東南口店", "麻布十番店", "蒲田店", "所沢店", "溝の口店", "渋谷宇田川町店", "恵比寿店", "新宿歌舞伎町店"], "records": [{"month": "2026年5月", "datetime": "2026/5/31 18:49", "visits": "1", "store": "西新宿一丁目店", "dissat": "", "comment": "お手本の用な接客でした。\nここを選んで良かったと思えました。\nありがとうございました。"}, {"month": "2026年5月", "datetime": "2026/5/31 17:20", "visits": "74", "store": "大宮店", "dissat": "", "comment": "いつも笑顔で迎えてくださってありがとうございます。\nポイント交換なのですが、2500円に上がったワインも2500ポイントで交換出来るようにして欲しいです。"}, {"month": "2026年5月", "datetime": "2026/5/31 17:12", "visits": "1", "store": "上野店", "dissat": "", "comment": "初めての訪問だったが　アプリインストールの説明が無かった　座ってる自分の背中に\n店員が毎回ぶつかっていた"}, {"month": "2026年5月", "datetime": "2026/5/31 17:11", "visits": "1", "store": "所沢店", "dissat": "", "comment": "素晴らしい時間を過ごせました。ありがとうございます。"}, {"month": "2026年5月", "datetime": "2026/5/31 0:12", "visits": "2", "store": "京急蒲田店", "dissat": "", "comment": "荷物入れるの箱が有れば、嬉しいです"}, {"month": "2026年5月", "datetime": "2026/5/30 23:06", "visits": "2", "store": "立川店", "dissat": "", "comment": "いつも美味しい料理を提供してくださりありがとうございます"}, {"month": "2026年5月", "datetime": "2026/5/30 21:44", "visits": "1", "store": "京急蒲田店", "dissat": "ご飯系をメニューに入れて欲しい", "comment": ""}, {"month": "2026年5月", "datetime": "2026/5/30 21:41", "visits": "1", "store": "溝の口店", "dissat": "", "comment": "料理が出てくるのが非常に遅かったです。二時間制の席だと説明を受けましたがはじめの料理が出てくるまでにすでに30分以上はかかっていました。初めにオーダーしたものが二時間経っても出てこなかったので声をかけたところオーダーが通ってなかった、今から作るので10分ぐらいかかる、と言われて仕方なく諦めて店を出ました。料理は美味しくコスパも良く、店内も活気があってとてもいい店だと思うのですがオーダーのスムーズさだけは本当に良くないなと思いました。Googleのレビューを見たところ半年前ぐらいからこのような状況が突然散見されているようなので原因調査と改善を求めます。"}, {"month": "2026年5月", "datetime": "2026/5/30 19:44", "visits": "1", "store": "横浜鶴屋町店", "dissat": "", "comment": "美味しかったです！ご馳走さまでした！"}, {"month": "2026年5月", "datetime": "2026/5/30 19:32", "visits": "7", "store": "麻布十番店", "dissat": "ラストオーダーと声をかけられたが、ドリンクのラストオーダーには早く（多分追加で頼むフードのラストオーダーのことだったと思う）戸惑いました。", "comment": ""}, {"month": "2026年5月", "datetime": "2026/5/30 19:32", "visits": "3", "store": "たまプラーザ店", "dissat": "スパークリングワインが炭酸抜けてた。", "comment": ""}, {"month": "2026年5月", "datetime": "2026/5/30 19:22", "visits": "1", "store": "錦糸町店", "dissat": "電子タバコだけでも店内で吸えると、また行きたいと思う", "comment": "仕方ないとは思うが他の客の話し声が大き過ぎで店内がうるさい。会話が聞きにくくて困る。もう少し静かだとよい"}, {"month": "2026年5月", "datetime": "2026/5/30 18:57", "visits": "1", "store": "たまプラーザ店", "dissat": "", "comment": "料理、ドリンクの提供も適切でスタッフもにこやかで良かったと思います。\n予約で訪問時にまともに確認されずトラブったのはご愛嬌として。\nただ二人で行って、ドリンクを二人同時に何回か頼み、テーブルに持ってくるとどちらがどのドリンクか聞かず、勝手に決めて渡していくことが４〜５回あり、誰が持ってきても同じ対応なのはちょっとビックリしました。それも全て逆だった。"}, {"month": "2026年5月", "datetime": "2026/5/30 18:37", "visits": "1", "store": "大宮店", "dissat": "", "comment": "クレジットカードでの支払いの場合、カードをスタッフへ渡して席で精算を待つのはやはりセキュリティ面で多少不安を感じる。\n個人的にには、多少面倒でも席を立ちレジまで行き目の前でカード決済した方が安心のような気がする。\nクレジットカードでの支払いの場合は、カードを預けるかレジまで行き支払いをするか確認してみてもいいのではないかと思った。"}, {"month": "2026年5月", "datetime": "2026/5/30 18:15", "visits": "1", "store": "たまプラーザ店", "dissat": "席の隣に資材を置いてあったり、休憩中のスタッフさんが座っていたり、ゆっくり過ごせなく、衛生的に汚さを感じた。\n予約して行って1人いけなくなったのですが、適当な席を選ばれた感じがして残念でした。", "comment": ""}, {"month": "2026年5月", "datetime": "2026/5/30 17:38", "visits": "1", "store": "京急蒲田店", "dissat": "注文した料理がぜんぜん届かず、1時間ほどたってからこちらから確認したらオーダーが通ってなかった。\nその際、確認しますとさがったあとオーダーが通ってなかった。（ラインアプリ上ではちゃんと通っていた）\nその後キャンセルしたが、謝罪が一言もなかったので違和感を感じた。", "comment": ""}, {"month": "2026年5月", "datetime": "2026/5/30 17:04", "visits": "3", "store": "京急蒲田店", "dissat": "テーブルチャージがあるのを会計時に知った！\n最初に分かるようにしてほしかった。", "comment": "初めて行った時はオーダーしてから出てくるまで大分時間がかかっていたが、行くたびに改善されているので、努力されていると感じた。\nこれからも是非行きたいとおもいます。"}, {"month": "2026年5月", "datetime": "2026/5/29 23:23", "visits": "1", "store": "渋谷宇田川町店", "dissat": "客層が最悪", "comment": "座席の配置にもう少し余裕があると、入り口近くの座席でも落ち着いて食事ができそうです。今回は、2名で最初に入り口近くの座席を案内されましたが、そのあと、奥の3人席を使わせてくださいました。ありがとうございました。"}, {"month": "2026年5月", "datetime": "2026/5/29 22:29", "visits": "4", "store": "上野店", "dissat": "何回も注文しているが、\nたまたまかもしれないが\n今回は火の入りが均一ではなかった。", "comment": ""}, {"month": "2   if(!ignoreStore && r.store!==curStore) return false;
  if(curMonth!=="all" && r.month!==curMonth) return false;
  if(curType==="dissat" && !r.dissat) return false;
  if(curType==="comment" && !r.comment) return false;
  if(curSearch){
    const hay = (r.dissat+" "+r.comment+" "+r.store).toLowerCase();
    if(!hay.includes(curSearch.toLowerCase())) return false;
  }
  return true;
}

function storeCount(store){
  return DATA.records.filter(r=>{
    if(r.store!==store) return false;
    if(curMonth!=="all" && r.month!==curMonth) return false;
    if(curType==="dissat" && !r.dissat) return false;
    if(curType==="comment" && !r.comment) return false;
    if(curSearch){
      const hay=(r.dissat+" "+r.comment+" "+r.store).toLowerCase();
      if(!hay.includes(curSearch.toLowerCase())) return false;
    }
    return true;
  }).length;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  DATA.stores.forEach(store=>{
    const n = storeCount(store);
    const b = document.createElement('button');
    b.className = 'tab'+(store===curStore?' active':'');
    b.innerHTML = esc(store)+' <span class="badge">'+n+'</span>';
    b.onclick = ()=>{curStore=store; render();};
    tabs.appendChild(b);
  });
}

function render(){
  renderTabs();
  const rows = DATA.records
    .filter(r=>recPasses(r,false))
    .sort((a,b)=> a.datetime<b.datetime?1:-1);

  document.getElementById('panel-title').textContent = curStore || '—';
  document.getElementById('panel-sub').textContent =
    '抽出 '+rows.length+' 件'+(curMonth!=="all"?'（'+curMonth+'）':'');

  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    const dissatCell = r.dissat
      ? '<div class="cell-dissat filled txt">'+hl(r.dissat)+'</div>'
      : '<span class="empty">—</span>';
    const commentCell = r.comment
      ? '<div class="cell-comment filled txt">'+hl(r.comment)+'</div>'
      : '<span class="empty">—</span>';
    tr.innerHTML =
      '<td class="dt">'+esc(r.datetime)+'</td>'+
      '<td>'+monthTag(r.month)+'</td>'+
      '<td class="visits"><span class="vpill">'+esc(r.visits)+'</span></td>'+
      '<td class="c-dissat">'+dissatCell+'</td>'+
      '<td class="c-comment">'+commentCell+'</td>';
    tb.appendChild(tr);
  });
  document.getElementById('noresult').style.display = rows.length? 'none':'block';
}

function refreshStats(){
  const inScope = DATA.records.filter(r=>{
    if(curMonth!=="all" && r.month!==curMonth) return false;
    return true;
  });
  document.getElementById('s-total').textContent = inScope.length;
  document.getElementById('s-dissat').textContent = inScope.filter(r=>r.dissat).length;
  document.getElementById('s-comment').textContent = inScope.filter(r=>r.comment).length;
  const st = new Set(inScope.map(r=>r.store));
  document.getElementById('s-stores').textContent = st.size;
}

document.getElementById('month-seg').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  curMonth = e.target.dataset.m;
  refreshStats(); render();
});
document.getElementById('type-seg').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  curType = e.target.dataset.t;
  render();
});
document.getElementById('search').addEventListener('input',e=>{
  curSearch = e.target.value.trim();
  render();
});

refreshStats();
render();
</script>
</body>
</html>
